name: Daily Flood Risk Forecast

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the forecast script
        run: python scripts/predict_flood_risk.py

      - name: Commit and push updated forecast data
        run: |
          git config user.name "Flood Risk Bot"
          git config user.email "actions@github.com"
          git add data/etiosa_dynamic_risk_grid.geojson
          git diff --staged --quiet || git commit -m "Daily forecast update: $(date -u +'%Y-%m-%d')"
          git push
